<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registrarse — BiblioDigital</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/base.css"/>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
    .auth-back { position: fixed; top: 1.5rem; left: 1.5rem; font-size: .78rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; display: flex; align-items: center; gap: .4rem; }
    .auth-back:hover { color: var(--cream); }
    .reg-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px; padding: 3rem; width: 100%; max-width: 480px; }
    .auth-logo { font-family: var(--font-head); font-size: 1.1rem; color: var(--gold); margin-bottom: .25rem; }
    .auth-logo span { color: var(--cream); font-style: italic; }
    .auth-title { font-family: var(--font-head); font-size: 1.8rem; margin-bottom: .4rem; }
    .auth-sub { font-size: .85rem; color: var(--muted); margin-bottom: 2rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .auth-footer { margin-top: 1.5rem; font-size: .82rem; color: var(--muted); text-align: center; }
    .auth-footer a { color: var(--gold); }
    .terms { font-size: .78rem; color: var(--muted); margin-top: 1rem; text-align: center; }
  </style>
</head>
<body>
  <a href="../index.html" class="auth-back">← Volver al inicio</a>

  <div class="reg-card">
    <p class="auth-logo">Biblio<span>Digital</span></p>
    <h1 class="auth-title">Crear cuenta</h1>
    <p class="auth-sub">Registrate para explorar y reservar libros.</p>

    <form id="reg-form">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="nombre">Nombre</label>
          <input class="form-input" type="text" id="nombre" placeholder="Ana" required/>
          <p class="form-error" id="err-nombre"></p>
        </div>
        <div class="form-group">
          <label class="form-label" for="apellido">Apellido</label>
          <input class="form-input" type="text" id="apellido" placeholder="García" required/>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Correo electrónico</label>
        <input class="form-input" type="email" id="email" placeholder="tu@correo.com" required/>
        <p class="form-error" id="err-email"></p>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <input class="form-input" type="password" id="password" placeholder="Mínimo 6 caracteres" required/>
        <p class="form-error" id="err-pass"></p>
      </div>
      <div class="form-group">
        <label class="form-label" for="password2">Confirmar contraseña</label>
        <input class="form-input" type="password" id="password2" placeholder="Repetí la contraseña" required/>
        <p class="form-error" id="err-pass2"></p>
      </div>
      <p class="form-error" id="err-general" style="margin-bottom:.75rem;"></p>
      <button type="submit" class="btn btn-primary" style="width:100%;padding:.75rem;">Crear cuenta</button>
    </form>

    <p class="terms">Al registrarte aceptás los términos del sistema.</p>
    <p class="auth-footer">¿Ya tenés cuenta? <a href="login.html">Iniciá sesión</a></p>
  </div>

<script src="../js/utils.js"></script>
  <script>
  const token = localStorage.getItem('access');
  if (token) window.location.href = 'panel-usuario.html';

  document.getElementById('reg-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const nombre    = document.getElementById('nombre').value.trim();
    const apellido  = document.getElementById('apellido').value.trim();
    const email     = document.getElementById('email').value.trim();
    const password  = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;
    const errG      = document.getElementById('err-general');
    const errP2     = document.getElementById('err-pass2');

    errG.classList.remove('visible');
    errP2.classList.remove('visible');

    if (password !== password2) {
      errP2.textContent = 'Las contraseñas no coinciden.';
      errP2.classList.add('visible');
      return;
    }

    try {
      const res = await fetch('/api/auth/register/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username:   email,
          email:      email,
          password:   password,
          first_name: nombre,
          last_name:  apellido
        })
      });

      const data = await res.json();

      if (!res.ok) {
        errG.textContent = data.username?.[0] || data.email?.[0] || 'Error al registrarse.';
        errG.classList.add('visible');
        return;
      }

      // Registro exitoso → hacer login automático
      const loginRes = await fetch('/api/token/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: email, password })
      });
      const loginData = await loginRes.json();
      localStorage.setItem('access', loginData.access);
      localStorage.setItem('refresh', loginData.refresh);

      window.location.href = 'panel-usuario.html';

    } catch (err) {
      errG.textContent = 'Error de conexión. Verificá que el servidor esté corriendo.';
      errG.classList.add('visible');
    }
  });
</script>
</body>
</html>
