<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mi panel — BiblioDigital</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/base.css"/>
  <style>
    .panel-header { padding: 6rem 3rem 2rem; border-bottom: 1px solid var(--border); background: var(--bg-card); display: flex; align-items: center; gap: 1.25rem; }
    .avatar { width: 52px; height: 52px; border-radius: 50%; background: rgba(201,168,76,0.15); border: 1px solid var(--gold-dim); display: flex; align-items: center; justify-content: center; font-family: var(--font-head); font-size: 1.3rem; color: var(--gold); }
    .panel-header h1 { font-size: 1.6rem; margin-bottom: .1rem; }
    .panel-header p  { font-size: .85rem; color: var(--muted); }

    .panel-tabs { padding: 0 3rem; background: var(--bg-card); border-bottom: 1px solid var(--border); display: flex; }
    .tab-btn { padding: .9rem 1.5rem; background: none; border: none; color: var(--muted); font-family: var(--font-body); font-size: .82rem; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; border-bottom: 2px solid transparent; transition: all .2s; margin-bottom: -1px; }
    .tab-btn:hover { color: var(--cream); }
    .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

    .tab-content { display: none; padding: 2.5rem 3rem; }
    .tab-content.active { display: block; }

    .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 1rem; margin-bottom: 2.5rem; }
    .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px; padding: 1.25rem; }
    .stat-num { font-family: var(--font-head); font-size: 2rem; color: var(--gold); }
    .stat-lbl { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

    .res-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px; padding: 1.25rem 1.5rem; display: flex; align-items: center; gap: 1.25rem; margin-bottom: .75rem; transition: border-color .2s; }
    .res-card:hover { border-color: var(--gold-dim); }
    .res-cover { width: 44px; height: 62px; flex-shrink: 0; border-radius: 2px 4px 4px 2px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; border: 1px solid var(--border); }
    .res-info { flex: 1; }
    .res-title { font-family: var(--font-head); font-size: .98rem; margin-bottom: .15rem; }
    .res-meta  { font-size: .77rem; color: var(--muted); }
    .res-state { text-align: right; }
    .empty-tab { text-align: center; padding: 3rem; color: var(--muted); }
    .empty-tab a { color: var(--gold); }

    @media (max-width: 768px) {
      .panel-header, .panel-tabs, .tab-content { padding-left: 1.25rem; padding-right: 1.25rem; }
    }
  </style>
</head>
<body>
  <nav class="navbar" id="main-nav"></nav>

  <div class="page-content">
    <div class="panel-header">
      <div class="avatar" id="user-avatar">?</div>
      <div>
        <h1 id="user-name">Cargando…</h1>
        <p id="user-email"></p>
      </div>
    </div>

    <div class="panel-tabs">
      <button class="tab-btn active" onclick="switchTab('reservas', this)">Mis reservas</button>
      <button class="tab-btn" onclick="switchTab('perfil', this)">Mi perfil</button>
    </div>

    <div class="tab-content active" id="tab-reservas">
      <div class="stat-row" id="stats-row"></div>
      <div id="reservas-list"></div>
    </div>

    <div class="tab-content" id="tab-perfil">
      <h2 style="font-size:1.2rem;margin-bottom:1.75rem;">Datos de la cuenta</h2>
      <div style="max-width:460px;">
        <div class="form-group">
          <label class="form-label">Nombre completo</label>
          <input class="form-input" type="text" id="prof-nombre"/>
        </div>
        <div class="form-group">
          <label class="form-label">Correo electrónico</label>
          <input class="form-input" type="email" id="prof-email"/>
        </div>
        <div class="form-group">
          <label class="form-label">Nueva contraseña <span style="color:var(--muted)">(opcional)</span></label>
          <input class="form-input" type="password" placeholder="Dejar vacío para no cambiar"/>
        </div>
        <button class="btn btn-primary" onclick="showToast('Perfil actualizado correctamente')">Guardar cambios</button>
        <button class="btn btn-danger btn-sm" onclick="cerrarSesion()" style="margin-left:.75rem;">Cerrar sesión</button>
      </div>
    </div>
  </div>

 <script>
  const API = 'http://127.0.0.1:8000/api';
  const token = localStorage.getItem('access_token');
  if (!token) window.location.href = 'login.html';

  function switchTab(id, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + id).classList.add('active');
  }

  async function init() {
    try {
      // Obtener datos del usuario
      const meRes = await fetch(`${API}/usuarios/me/`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!meRes.ok) { window.location.href = 'login.html'; return; }
      const user = await meRes.json();

      // Mostrar datos del usuario
      document.getElementById('user-avatar').textContent = (user.first_name || user.username).charAt(0).toUpperCase();
      document.getElementById('user-name').textContent   = `${user.first_name} ${user.last_name}`.trim() || user.username;
      document.getElementById('user-email').textContent  = user.email;
      document.getElementById('prof-nombre').value = `${user.first_name} ${user.last_name}`.trim();
      document.getElementById('prof-email').value  = user.email;

      // Obtener reservas
      const resRes = await fetch(`${API}/reservas/`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const reservas = await resRes.json();
      const activas  = reservas.filter(r => r.estado === 'activa').length;
      const pasadas  = reservas.filter(r => r.estado !== 'activa').length;

      document.getElementById('stats-row').innerHTML = `
        <div class="stat-card"><p class="stat-num">${reservas.length}</p><p class="stat-lbl">Total reservas</p></div>
        <div class="stat-card"><p class="stat-num">${activas}</p><p class="stat-lbl">Activas</p></div>
        <div class="stat-card"><p class="stat-num">${pasadas}</p><p class="stat-lbl">Historial</p></div>`;

      if (!reservas.length) {
        document.getElementById('reservas-list').innerHTML = `
          <div class="empty-tab"><p style="margin-bottom:.5rem;">No tenés reservas todavía.</p><a href="catalogo.html">Explorá el catálogo →</a></div>`;
        return;
      }

      document.getElementById('reservas-list').innerHTML = reservas.map(r => `
        <div class="res-card">
          <div class="res-cover" style="background:#1a1815">${r.libro_titulo ? r.libro_titulo.charAt(0) : '📖'}</div>
          <div class="res-info">
            <p class="res-title">${r.libro_titulo || 'Libro'}</p>
            <p class="res-meta">Reservado el ${r.fecha_reserva}</p>
            <p class="res-meta">Devolución: ${r.fecha_devolucion}</p>
          </div>
          <div class="res-state">
            <span class="badge ${r.estado === 'activa' ? 'badge-available' : 'badge-reserved'}">${r.estado === 'activa' ? 'Activa' : 'Vencida'}</span>
          </div>
        </div>`).join('');

    } catch(err) {
      console.error('Error:', err);
    }
  }

  function cerrarSesion() {
    localStorage.removeItem('access_token');
    localStorage.removeItem('refresh_token');
    localStorage.removeItem('user_data');
    window.location.href = 'login.html';
  }

  init();
</script>
</body>
</html>
